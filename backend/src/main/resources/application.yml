server:
  port: 8080

spring:
  application:
    name: linksphere-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linksphere_db}
    username: ${SPRING_DATASOURCE_USERNAME:linksphere_user}
    password: ${SPRING_DATASOURCE_PASSWORD:linksphere_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

app:
  jwt:
    secret: ${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  shortener:
    base-url: ${APP_SHORTENER_BASE_URL:http://localhost:8080/r}
    default-ttl-days: 365
